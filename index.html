<!DOCTYPE html>
<html>
<head>
	<title>Form</title>
	<link rel="stylesheet" type="text/css" href="style.css">
	<link rel="cardstyle" href="cardstyle">
<link href="https://fonts.googleapis.com/css2?family=Jost:wght@500&display=swap" rel="stylesheet">
</head>
<body>
	<div id="form" class="main">  	
		<input type="checkbox" id="chk" aria-hidden="true">

			<div class="signup">
				<form>
					<label id="signUp" for="chk" aria-hidden="true">Sign up</label>
					<input id="signUp-name" type="text" name="txt" placeholder="User name" required="">
					<input id="signUp-email" type="email" name="email" placeholder="Email" required="">
					<input id="signUp-password" type="password" name="pswd" placeholder="Password" required="">
					<button type="button" onclick="getDetails()">Sign up</button>
				</form>
			</div>

			<div class="login">
				<form>
					<label id="logIn" for="chk" aria-hidden="true">Login</label>
					<input id="logIn-email" type="email" name="email" placeholder="Email" required="">
					<input id="logIn-password" type="password" name="pswd" placeholder="Password" required="">
					<button onclick="logIn()" type="button">Login</button>
				</form>
			</div>

	</div>
	    
	<div id="myCard"></div>


	<script src="app.js"></script>
</body>
</html>
